<script>
/* =====================================================================
   RÉGLAGES (Anaïs, c'est ici que tu modifies)
   ===================================================================== */

// Lien du bouton final « Fais le CHECKPOINT ».
// Remplace l'adresse entre guillemets par la page CHECKPOINT si besoin.
const CHECKPOINT_URL = "https://www.chez-ladaronne.com/toncheckpoint";
// Lien du post Instagram du jeu (carrousel du 8/11). À remplir après la publication : un bouton « Copier le lien du post » apparaît alors sur l'écran final.
const POST_URL = "";

/* ---------------------------------------------------------------------
   SUIVI D'AUDIENCE : GoatCounter (ACTIVÉ, compte "ladaronne")
   Compteur de visites sans cookies, sans bandeau.
   Statistiques : https://ladaronne.goatcounter.com
   Pour couper le suivi : remplace "ladaronne" par "" (guillemets vides).
   Si la constante est vide, rien n'est chargé et rien n'est compté.
   Événements envoyés : début, chaque lieu ouvert, accusation,
   affaire classée, clic CHECKPOINT, partage.
   --------------------------------------------------------------------- */
const GOATCOUNTER_CODE = "ladaronne";

(function () {
  window.__gcQueue = [];
  if (!GOATCOUNTER_CODE) return;
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://" + GOATCOUNTER_CODE + ".goatcounter.com/count");
  s.onerror = function () { window.__gcQueue = []; }; // hors ligne : on ignore, le jeu continue
  s.onload = function () {
    var q = window.__gcQueue || [];
    window.__gcQueue = [];
    q.forEach(function (e) { try { window.goatcounter.count(e); } catch (err) {} });
  };
  document.head.appendChild(s);
})();

function track(path, title) {
  try {
    if (!GOATCOUNTER_CODE) return;
    var ev = { path: "affaire/" + path, title: title || path, event: true };
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(ev);
    else if (window.__gcQueue.length < 50) window.__gcQueue.push(ev);
  } catch (e) {}
}
</script>

<style>

  --cork:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .18 0 0 0 0 .11 0 0 0 0 .05 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#0d2326;color:var(--ivoire);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* ---------- Typo ---------- */

.sv-hero .k{font:500 10px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#6b8a82}
.sv-hero h3{font-family:var(--serif);font-size:54px;font-weight:600;margin:4px 0 6px;color:#24403c;letter-spacing:.02em}
.sv-hero p{margin:0;font-size:14px;color:#4b5755}
.sv-hero .sv-hook{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.2;color:#24403c;margin:4px 6px 10px}
.sv-hero .sv-promise{font-weight:500;color:#2f5b54}
.sv-list li .sv-li{width:auto;height:auto;border-radius:0;display:block;background:none;color:inherit;font:inherit;place-items:initial;flex:1}
.sv-list li .sv-li b{color:#24403c;font-weight:600}
.sv-wave{height:34px;margin:16px auto 0;width:70%;background:radial-gradient(ellipse 50% 100% at 50% 100%,transparent 60%,rgba(107,138,130,.4) 61%,transparent 66%) 0 0/34px 34px repeat-x;opacity:.7}
.sv-sec{padding:18px 20px;border-top:1px solid #efe6d6}
.sv-sec h4{font-family:var(--serif);font-size:21px;margin:0 0 10px;color:#24403c}
.sv-list{margin:0;padding:0;list-style:none;font-size:13.5px;color:#3e4a48}
.sv-list li{display:flex;gap:10px;padding:7px 0}
.sv-list li span{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--sans);background:#e6efe9;color:#3d6b62}
.sv-price{margin:6px 20px 22px;padding:20px;border-radius:16px;text-align:center;background:#fff;border:1px solid #e5dccb;box-shadow:0 8px 20px rgba(60,50,30,.08)}
.sv-price .amt{font-family:var(--serif);font-size:52px;font-weight:700;color:#24403c;line-height:1;display:block}
.sv-price small{display:block;color:#6a7573;font-size:12.5px;margin:4px 0 14px}
.sv-cta{display:block;width:100%;min-height:50px;border-radius:12px;border:0;background:#2f5b54;color:#fff;font:600 15px var(--sans);letter-spacing:.06em}
.sv-foot{padding:14px 20px 22px;font-size:11px;color:#8b928f;text-align:center}

/* Fiche de surveillance */
.fiche{margin-top:18px;padding:0;overflow:hidden;--rot:-.6deg;transform:rotate(-.6deg);width:100%;text-align:left;border:0}
.fiche .ftab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;font-family:var(--typo);font-size:14px}
.fiche .ftab b{font-family:var(--serif);font-size:20px;font-weight:600}
.fiche .fbody{display:none;padding:0 18px 18px;font-family:var(--typo);font-size:14.5px;line-height:1.7;border-top:1px dashed rgba(38,48,47,.3)}
.fiche.open .fbody{display:block;animation:fadeIn .5s both}
.fiche .tap{display:block;margin-top:6px;font-family:var(--typo);font-size:12.5px;color:#00525B;letter-spacing:.04em}
.fiche.open .tap{display:none}
.fiche .redact{display:inline-block;background:#26302f;color:transparent;border-radius:2px;line-height:1.1}
.fiche mark{background:linear-gradient(180deg,transparent 55%,rgba(201,169,110,.55) 55%);color:inherit;padding:0 2px}

/* Formulaire */
.steps{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #ece3d2;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:#2b3433;text-align:left;border-radius:0}
.steps .dots{display:flex;gap:5px;flex:1}
.steps .dots i{flex:1;height:5px;border-radius:3px;background:#e5dccb}
.steps .dots i.on{background:#2f5b54}
.steps b{font:600 12.5px var(--sans);white-space:nowrap}
.form{padding:14px 16px 18px}
.form h4{font-family:var(--serif);font-size:22px;margin:4px 0 2px;color:#24403c}
.form .sub{font-size:12px;color:#7a8381;margin:0 0 12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;padding:8px;margin:0 -8px;border:0;background:none;text-align:left;color:#2b3433;box-sizing:content-box}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font:500 10.5px var(--sans);color:#5d6866}
.field label em{color:#9a5b2b;font-style:normal}
.inp{height:34px;border-radius:8px;border:1px solid #ddd3c1;background:#fffdf8}
.inp.sel{display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;color:#a0a6a4}
.acct{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:12px;border-radius:10px;background:#f4eee3;border:1px solid #e5dccb;font-size:12px;color:#3e4a48;text-align:left;width:100%}
.acct .cb{flex:none;width:20px;height:20px;border-radius:5px;background:#2f5b54;color:#fff;display:grid;place-items:center;font-size:13px;margin-top:1px}
.acct small{display:block;color:#7a8381;font-size:10.5px;margin-top:3px}
.form .go{margin-top:14px}

/* Boîte mail */
.sister{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px;padding:14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(201,169,110,.2)}
.sister .av{flex:none;background:linear-gradient(135deg,#9fb8b1,#5b7f78);color:#0d2326}
.sister p{margin:0;font-family:var(--typo);font-size:14px;line-height:1.55}
.sister small{display:block;font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--or);margin-bottom:4px}
.mailapp{background:#fbf8f2;color:#2b3433;border-radius:22px;overflow:hidden;border:1px solid rgba(201,169,110,.4);box-shadow:0 20px 44px rgba(0,0,0,.5)}
.mtop{padding:16px 16px 10px;font-family:var(--serif);font-size:24px;font-weight:600;color:#24403c}
.mtabs{display:flex;gap:6px;padding:0 12px 10px}
.mtab{flex:1;min-height:42px;border-radius:10px;border:1px solid #e3d9c6;background:#f3ede1;font:500 13px var(--sans);color:#4b5755}
.mtab.on{background:#24403c;border-color:#24403c;color:#fff}
.mlist{border-top:1px solid #ece3d2}
.mrow{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid #f0e8da;background:none;color:#2b3433;border-radius:0}
.mrow b{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.mrow b small{font:400 11px var(--typo);color:#8b928f;white-space:nowrap}
.mrow span{display:block;font-size:12.5px;color:#66706e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.unread b{color:#00525B}
.mrow.spot{border-radius:0}
.mread{padding:16px;font-size:13.5px;line-height:1.55;animation:fadeIn .4s both}
.mread h5{font-family:var(--serif);font-size:20px;margin:0 0 6px;color:#24403c}
.mread .meta{font:400 11.5px var(--typo);color:#7a8381;margin-bottom:12px}
.mread .fakebtn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:8px;background:#2f5b54;color:#fff;font-size:12.5px}
.spamflag{display:inline-block;font:500 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#7a3b16;border:1px solid rgba(122,59,22,.4);border-radius:4px;padding:2px 6px;margin-bottom:8px}

/* Caisse */
.counter{position:relative;padding:26px 16px 30px;border-radius:16px;background:linear-gradient(180deg,#2a1e15,#1b130d);border:1px solid rgba(201,169,110,.25);box-shadow:inset 0 2px 30px rgba(0,0,0,.5)}
.counter::before{content:"";position:absolute;inset:0;border-radius:16px;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(220,160,78,.16),transparent 70%);pointer-events:none}
.terminal{display:flex;align-items:center;gap:12px;margin:22px auto 0;width:84%;padding:12px;border-radius:12px;background:#121b1c;border:1px solid rgba(201,169,110,.25);color:var(--ivoire);text-align:left}
.terminal .scr{flex:none;width:64px;height:40px;border-radius:6px;background:#0a2f33;display:grid;place-items:center;font:400 10px var(--typo);color:#9fd0c9}
.terminal span{font-size:12.5px;color:rgba(255,247,234,.75)}

/* Espace membre */
.vault{position:relative;padding:28px 16px 22px;border-radius:16px;text-align:center;background:radial-gradient(ellipse 70% 60% at 50% 30%,rgba(0,82,91,.45),rgba(0,0,0,.4));border:1px solid rgba(201,169,110,.18);overflow:hidden}
.door{display:block;margin:0 auto;width:210px;max-width:70%;border:0;background:none;padding:0;border-radius:8px}
.door svg{display:block;width:100%;height:auto}
.vault .sign{margin:16px auto 0;font-family:var(--typo);font-size:14px;color:rgba(255,247,234,.8)}

/* Journal du compte */
.journal{display:block;width:100%;margin-top:16px;padding:16px 18px;text-align:left;border:0;--rot:.5deg;transform:rotate(.5deg);font-family:var(--typo);color:var(--encre)}
.journal .jt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.journal .jt b{font-family:var(--serif);font-size:20px;font-weight:600}
.journal .jt span{font-size:12.5px;color:#5f665e}
.journal .tap{display:block;margin-top:6px;font-size:12.5px;color:#00525B;letter-spacing:.04em}
.journal .jl{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(38,48,47,.3);font-size:14px;line-height:1.7}
.journal mark{background:linear-gradient(180deg,transparent 55%,rgba(201,169,110,.55) 55%);color:inherit;padding:0 2px}

/* Bureau */
.desk{position:relative;width:100%;aspect-ratio:39/46;border-radius:16px;overflow:hidden;border:1px solid rgba(201,169,110,.25);box-shadow:0 20px 44px rgba(0,0,0,.5);
  background:linear-gradient(180deg,#0e3034 0%,#0b2629 58%,#3a291c 58%,#4a3524 62.5%,#2c1f15 62.5%,#21170f 100%)}
.desk .wall{position:absolute;inset:0 0 42% 0;background:repeating-linear-gradient(90deg,rgba(255,247,234,.025) 0 2px,transparent 2px 38px)}
.desk .win{position:absolute;right:6%;top:6%;width:30%;height:34%;border:2px solid rgba(201,169,110,.35);background:repeating-linear-gradient(180deg,rgba(201,169,110,.12) 0 6px,rgba(0,0,0,.25) 6px 11px)}
.desk .frame{position:absolute;left:40%;top:7%;width:16%;height:14%;border:2px solid rgba(201,169,110,.45);background:#0a2023;display:grid;place-items:center;font:600 10px var(--serif);color:rgba(201,169,110,.7);text-align:center;line-height:1.1}
.desk .glow{position:absolute;inset:0;pointer-events:none;transition:opacity .6s ease;background:radial-gradient(ellipse 55% 40% at 22% 52%,rgba(220,160,78,.38),transparent 70%)}
.desk.off .glow{opacity:0}
.desk .dark{position:absolute;inset:0;pointer-events:none;background:rgba(3,10,11,.5);opacity:0;transition:opacity .6s ease}
.desk.off .dark{opacity:1}
.desk .obj{position:absolute;border:0;background:none;padding:0;border-radius:10px}
.desk .obj svg{display:block;width:100%;height:100%}
.desk .obj .lbl{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);font:500 10px var(--sans);letter-spacing:.08em;color:rgba(255,247,234,.7);white-space:nowrap;pointer-events:none}
.desk .drawer-face{position:absolute;inset:0;border:1.5px solid rgba(201,169,110,.35);border-radius:4px;background:linear-gradient(180deg,#2b1e14,#24180f)}
.desk .drawer-face::after{content:"";position:absolute;left:50%;top:50%;width:28%;height:12%;transform:translate(-50%,-50%);border-radius:6px;background:linear-gradient(180deg,#e3cb98,#a88550)}

/* Interrogatoire */
.room{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 10px 14px;border-radius:14px;border:1px solid rgba(201,169,110,.28);background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,82,91,.3));color:inherit}
.scard .portrait{width:100%;max-width:120px}
.scard .nm{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.1}
.scard .st{font-size:11.5px;color:rgba(255,247,234,.62)}
.scard.done{border-color:rgba(201,169,110,.7)}
.scard .ok{position:absolute;top:8px;right:8px;font:600 10px var(--sans);letter-spacing:.1em;color:#0d2326;background:var(--or);border-radius:999px;padding:3px 8px}
.portrait{display:block;height:auto;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.spotlight{position:relative;padding:18px 0 6px;text-align:center}
.spotlight::before{content:"";position:absolute;left:50%;top:-30px;width:360px;max-width:100%;height:280px;transform:translateX(-50%);background:radial-gradient(ellipse 45% 60% at 50% 20%,rgba(255,240,210,.20),transparent 70%);pointer-events:none}
.spotlight .portrait{width:150px;margin:0 auto;position:relative}
.spotlight .nm{font-family:var(--serif);font-weight:600;font-size:30px;margin:12px 0 0}
.spotlight .role{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
.spotlight .desc{font-family:var(--typo);font-size:14px;color:rgba(255,247,234,.8);margin:10px 4px 0}
.dialog{margin:16px 0 8px;display:flex;flex-direction:column;gap:10px}
.q{align-self:flex-end;max-width:86%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:rgba(201,169,110,.16);border:1px solid rgba(201,169,110,.35);font-size:14px}
.a{align-self:flex-start;max-width:92%;padding:14px 16px;border-radius:4px 16px 16px 16px;font-family:var(--typo);font-size:15px;line-height:1.6}
.qbtns{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.qbtn{min-height:54px;padding:12px 16px;border-radius:14px;border:1px solid rgba(201,169,110,.5);background:rgba(0,0,0,.2);color:var(--ivoire);font:500 14.5px/1.35 var(--sans);text-align:left}
.qbtn[disabled]{opacity:.38}
.qbtn.used{opacity:.38;text-decoration:line-through;text-decoration-color:rgba(201,169,110,.7)}

/* Tableau en liège */
.cork{position:relative;padding:14px 10px 18px;border-radius:8px;border:10px solid #2b1f16;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,169,110,.25),0 20px 40px rgba(0,0,0,.5);
  background-color:#8a6845;background-image:var(--cork),radial-gradient(ellipse at 50% 40%,rgba(255,220,170,.18),transparent 70%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.45),transparent 60%)}
.threads{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
.suspects-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:2}
.pol{position:relative;display:block;padding:5px 5px 6px;background:#f3ebdb;border:0;border-radius:2px;box-shadow:0 6px 12px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));color:#26302f;transition:transform .25s}
.pol .portrait{width:100%;box-shadow:none;border-radius:0}
.pol .nm{display:block;font:400 9.5px/1.2 var(--typo);margin-top:4px;text-align:center;min-height:2.4em}
.pol.target{transform:rotate(var(--r,0deg)) scale(1.05);box-shadow:0 0 0 2px var(--or),0 10px 18px rgba(0,0,0,.5)}
.pol.innocent::after{content:"";position:absolute;left:-8%;right:-8%;top:44%;height:4px;border-radius:2px;background:linear-gradient(90deg,#a8834a,#ecd6a4,#a8834a);transform:rotate(-30deg);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pol .tag{position:absolute;left:50%;top:22%;transform:translateX(-50%) rotate(-8deg);font:400 8px var(--typo);letter-spacing:.08em;color:#f3ebdb;background:rgba(0,61,68,.92);padding:2px 5px;border-radius:2px;white-space:nowrap;z-index:2}
.pol .tag.sus{background:rgba(122,32,27,.94)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;font:400 13px var(--typo);color:rgba(255,247,234,.85)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg{display:inline-block;width:26px;height:3px;border-radius:2px}
.lg.gold{background:#ecd6a4}
.lg.red{background:#a8352b;box-shadow:0 0 0 1px rgba(255,247,234,.25)}
.pol .charges{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:#a8352b;color:#FFF7EA;font:600 11px/20px var(--sans);text-align:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin{position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe8bf,#C9A96E 45%,#7d6235);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:4}
.pol .pin{top:auto;bottom:-5px}
.clues-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin-top:30px;position:relative;z-index:2}
.ccard{position:relative;display:block;width:100%;padding:14px 10px 10px;text-align:left;border:0;transform:rotate(var(--r,0deg));transition:transform .2s, box-shadow .2s}
.ccard .n{font:400 10px var(--typo);color:#6b6f66}
.ccard b{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.15;margin-top:2px;color:#1d2a2b}
.ccard .rc{display:block;margin-top:5px;font:400 11.5px/1.4 var(--typo);color:#4a524f}
.ccard.sel{transform:rotate(0) translateY(-3px) scale(1.03);box-shadow:0 0 0 2px #00525B,0 14px 26px rgba(0,0,0,.5)}
.ccard.linked::before{content:"";position:absolute;right:8px;bottom:8px;width:8px;height:8px;border-radius:50%;background:#00525B}
.boardmsg{min-height:3.4em;margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25);font-family:var(--typo);font-size:14px;line-height:1.5}
.boardmsg.bad{animation:shake .35s}

/* Accusation */
.accgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accs{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid rgba(201,169,110,.28);background:rgba(0,0,0,.2);color:inherit;text-align:left;min-height:84px}
.accs .portrait{width:46px;flex:none;box-shadow:none}
.accs .nm{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.1}
.accs.on{border-color:var(--or);background:rgba(201,169,110,.16);box-shadow:0 0 0 1px var(--or)}
.accs.inn .nm{text-decoration:line-through;text-decoration-color:var(--or)}
.accp{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1px solid rgba(201,169,110,.25);background:rgba(255,247,234,.04);color:inherit;text-align:left;min-height:56px}
.accp .box{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--or);display:grid;place-items:center;font-size:13px;color:#0d2326}
.accp.on{border-color:var(--or);background:rgba(201,169,110,.14)}
.accp.on .box{background:var(--or)}
.accp b{display:block;font-family:var(--serif);font-size:17px;line-height:1.15}
.accp .rc{display:block;margin-top:3px;font:400 12.5px/1.45 var(--typo);color:rgba(255,247,234,.72)}
.accp small{font:400 11px var(--typo);color:rgba(255,247,234,.55)}
.stickybar{position:sticky;bottom:0;z-index:5;margin:16px -16px -28px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,35,38,0),#0d2326 30%)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec-title .h3{margin:0}

/* Modales */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,14,15,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .3s both}
.sheet{width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow-y:auto;padding:24px 20px 20px;--rot:-1.2deg;animation:slidePaper .6s cubic-bezier(.2,.8,.2,1) both}
.sheet .n{font-family:var(--typo);font-size:12.5px;color:#5f665e;letter-spacing:.06em}
.sheet .h2{color:#0d2326;font-size:27px;margin-top:6px}
.sheet .body{font-family:var(--typo);font-size:15px;line-height:1.65;margin:10px 0 18px}
.sheet .stamp{position:absolute;right:14px;top:16px;font-size:11px;--sr:10deg;padding:4px 8px}
.sheet .btn.ghost{color:#00525B;border-color:rgba(0,82,91,.5);background:transparent}
.sheet.dark{background:#0f2b2e;color:var(--ivoire);border:1px solid rgba(201,169,110,.4);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sheet.dark .body{color:var(--ivoire)}
.note{position:fixed;z-index:55;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;padding:14px 16px 14px 18px;transform:translateX(-50%);font-family:var(--typo);font-size:14.5px;line-height:1.55;animation:noteIn .45s cubic-bezier(.2,.8,.2,1) both;border:0;text-align:left}
.note small{display:block;font:500 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#00525B;margin-bottom:4px}
@keyframes noteIn{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}

/* Fin */

function fr(t){
  return String(t)
    .replace(/« /g, '« ')
    .replace(/ ([»?!:;])/g, ' $1')
    .replace(/(\d) h (\d)/g, '$1 h $2')
    .replace(/ sur (\d)/g, '\u00a0sur\u00a0$1')
    .replace(/(\d) (€|min\b|s\b|champs|étapes|séances|sur\b|minute)/g, '$1 $2');
}
function setHTML(el, html){ el.innerHTML = fr(html); }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================

function fresh(){
  return { screen:'intro', startTime:null, endTime:null, elapsed:0, spots:{}, clues:[], done:{}, asked:{}, links:{}, attempts:0, solved:false, lamp:true, visited:{} };

  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function wipe(){
  try { localStorage.removeItem(KEY); } catch (e) {}
}

(function(){ const saved = load(); if (saved && typeof saved === 'object') S = Object.assign(fresh(), saved); })();
// Migration : l'ancienne version avait un lieu « La caisse » et un indice « ticket »
function migrate(){
  try {

/* =====================================================================
   MACHINE À ÉCRIRE
   ===================================================================== */
let SEQ = null;
const skipBtn = $('#skip');
function newSeq(){
  if (SEQ) { SEQ.cancel = true; clearTimeout(SEQ.timer); }
  SEQ = { fast:false, skip:false, cancel:false, timer:0 };
  skipBtn.hidden = true;
  return SEQ;
}
skipBtn.addEventListener('click', () => { if (SEQ) SEQ.skip = true; skipBtn.hidden = true; });
function wait(ms, seq){ return new Promise(r => { seq.timer = setTimeout(r, ms); }); }

function typeInto(el, text, seq, speed){
  speed = speed || 24;
  text = fr(text);
  return new Promise(res => {
    const chars = Array.from(text);
    if (REDUCED || seq.skip) { el.textContent = text; return res(); }
    const tn = document.createTextNode(''), caret = document.createElement('span');
    caret.className = 'caret'; el.textContent = ''; el.append(tn, caret);
    let i = 0;
    const step = () => {
      if (seq.cancel) return;
      if (seq.skip) { tn.data = text; caret.remove(); return res(); }
      i = Math.min(chars.length, i + (seq.fast ? 6 : 1));
      tn.data = chars.slice(0, i).join('');
      if (i >= chars.length) { caret.remove(); return res(); }
      const ch = chars[i - 1]; let d = seq.fast ? 8 : speed;
      if (!seq.fast) { if ('.!?…'.indexOf(ch) > -1) d = speed * 9; else if (',;:'.indexOf(ch) > -1) d = speed * 4; }
      seq.timer = setTimeout(step, d);
    };
    step();
  });
}
// Écrit une suite de lignes. Un tap sur la zone accélère, « Passer » affiche tout.
async function playLines(box, lines, seq, onDone){
  if (!REDUCED) skipBtn.hidden = false;
  box.addEventListener('click', () => { seq.fast = true; });
  for (const L of lines) {
    if (seq.cancel) return;
    const p = document.createElement('p');
    p.className = 'ln ' + (L.c || '');
    if (L.t) { const b = document.createElement('b'); b.className = 'tm'; b.textContent = fr(L.t); p.append(b); }
    const sp = document.createElement('span'); p.append(sp); box.append(p);
    await typeInto(sp, L.x, seq, L.speed);
    if (seq.cancel) return;
    if (!seq.skip && !REDUCED) await wait(L.pause != null ? L.pause : 280, seq);
  }
  if (seq.cancel) return;
  skipBtn.hidden = true;
  if (onDone) onDone();
}

  document.body.append(n);
  noteTimer = setTimeout(() => { n.remove(); }, 5200);
}
function closeOverlay(){ const o = $('.overlay'); if (o) o.remove(); }
function overlay(html, cls, onClose){
  closeOverlay();
  const o = document.createElement('div');
  o.className = 'overlay'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
  setHTML(o, `<div class="sheet ${cls || 'paper'}">${html}</div>`);
  o.addEventListener('click', e => {
    const c = e.target.closest('[data-close]');
    if (c || e.target === o) { o.remove(); if (onClose) onClose(c ? c.getAttribute('data-close') : ''); }
  });
  document.body.append(o);
  const b = o.querySelector('button'); if (b) try { b.focus({ preventScroll:true }); } catch (e) {}

}

/* =====================================================================
   LOGIQUE DE JEU
   ===================================================================== */
function lieuDone(id){ return Object.keys(CLUES).filter(k => CLUES[k].lieu === id).every(k => S.clues.indexOf(k) > -1); }
function lieuUnlocked(i){ return i === 0 || !!S.done[LIEUX[i - 1].id]; }
function suspectDone(id){ return (S.asked[id] || []).length >= 2; }
function allSuspectsDone(){ return SUSPECTS.every(s => suspectDone(s.id)); }
function accusationMissing(){
  const m = [];
  const keysOk = KEY_CLUES.every(k => S.clues.indexOf(k) > -1);
  if (!keysOk) m.push('suivre Violette jusqu’à l’espace membre');
  if (!allSuspectsDone()) m.push('interroger les 4 suspects');
  return m;
}
function updateDone(){
  LIEUX.forEach(l => { S.done[l.id] = lieuDone(l.id); });
  S.done.bureau = lieuDone('bureau');
}
function isInnocent(sid){ return Object.keys(S.links).some(k => S.links[k] === sid && CLUES[k].rel.t === 'alibi' && CLUES[k].rel.s === sid); }
// Soupçons : tout fil (non alibi) relié au bon suspect. Un alibi l'emporte toujours.
function chargesOn(sid){ return Object.keys(S.links).filter(k => S.links[k] === sid && CLUES[k].rel.s === sid && CLUES[k].rel.t !== 'alibi').length; }
const FEM = { prix:true, tard:true };

function hitSpot(id){
  const first = !S.spots[id];
  S.spots[id] = 1;
  $$(`[data-spot="${id}"]`).forEach(e => e.classList.add('seen'));
  const newly = Object.keys(CLUES).filter(k => S.clues.indexOf(k) < 0 && CLUES[k].needs.every(n => S.spots[n]));
  if (newly.length) {
    newly.forEach(k => S.clues.push(k));
    updateDone(); save();
    showClue(newly[0]);
    return;
  }
  const owner = Object.keys(CLUES).find(k => CLUES[k].needs.indexOf(id) > -1 && S.clues.indexOf(k) > -1);
  if (!first && owner && CLUES[owner].needs.length === 1) { showClue(owner, true); return; }
  if (NOTES[id]) showNote(NOTES[id]);
  else if (CLUES.form.needs.indexOf(id) > -1) showNote(NOTES[id] || 'Noté.');
  updateDone(); save();
}

function hintText(){
  const n = S.clues.length;
  if (!S.done.dm) return "Commence par le téléphone de Margaux. Tout part d’un message.";
  if (!S.visited.bureau && n >= 2) return "Un détour par le bureau de Margaux ne te ferait pas de mal. Les bureaux parlent, quand on sait écouter.";
  if (!S.done.vente) return "Violette est allée sur la page de vente. Va voir ce qu’elle a vu.";
  if (!S.done.resa) return "Elle a cliqué sur « Je réserve ». Le prix ne lui a donc pas fait peur… Alors, qu’est-ce qui s’est passé après ?";
  if (!S.done.mail) return "Sa sœur nous a apporté son téléphone. Fouille sa boîte mail. Partout. Même là où personne ne regarde.";
  if (!S.done.membre) return "Dernier lieu : l’espace membre. Là où Violette aurait dû arriver. Son compte a laissé un journal. Lis-le.";
  if (!allSuspectsDone()) return "Les suspects attendent en salle d’interrogatoire. Ils adorent parler d’eux. Laisse-les faire.";
  if (!Object.keys(S.links).length) return "Tu as tout ce qu’il faut. Le tableau en liège peut t’aider à innocenter du monde. Puis, accuse.";
  return "Tu as tout ce qu’il faut. Direction l’accusation, preuves en main. Et pas de tremblement dans la voix.";
}

function go(screen){
  S.screen = screen;
  const first = !S.visited[screen];
  S.visited[screen] = 1;
  if (screen.indexOf('lieu:') === 0) track('lieu/' + screen.slice(5), 'Lieu ouvert : ' + screen.slice(5));
  else if (screen === 'bureau') track('lieu/bureau', 'Lieu ouvert : bureau de Margaux');
  else if (screen === 'interro' && first) track('interrogatoire', 'Salle d’interrogatoire');
  else if (screen === 'tableau' && first) track('tableau', 'Tableau en liège');
  render();
}

function render(){
  const seq = newSeq();
  closeOverlay();
  const n = $('.note'); if (n) n.remove();
  const s = S.screen || 'intro';
  screenEl.classList.remove('screen-in'); void screenEl.offsetWidth; screenEl.classList.add('screen-in');
  try {
    if (s === 'intro') scrIntro();
    else if (s === 'briefing') scrBriefing(seq);
    else if (s === 'carte') scrCarte();
    else if (s.indexOf('lieu:') === 0) scrLieu(s.slice(5), seq);
    else if (s === 'bureau') scrBureau(seq);
    else if (s === 'interro') scrInterro();
    else if (s.indexOf('suspect:') === 0) scrSuspect(s.slice(8));
    else if (s === 'tableau') scrTableau();
    else if (s === 'accusation') scrAccusation();
    else if (s === 'fin') scrFin(seq);
    else { S.screen = 'intro'; scrIntro(); }
  } catch (e) {
    console.error(e); S.screen = 'carte'; scrCarte();
  }
  $('#resetBtn').hidden = !S.startTime;
  save();
  try { window.scrollTo(0, 0); } catch (e) {}
}

  const s = SUS[id], asked = S.asked[id] || [];

async function askQ(id, qi){
  const s = SUS[id];
  S.asked[id] = S.asked[id] || [];
  if (S.asked[id].indexOf(qi) > -1) return;
  S.asked[id].push(qi); save();
  $$('.qbtn').forEach(b => b.disabled = true);
  const seq = newSeq();
  const d = $('#dialog');
  const q = document.createElement('div'); q.className = 'q'; q.textContent = fr(s.qa[qi].q); d.append(q);
  const a = document.createElement('div'); a.className = 'a paper'; d.append(a);
  try { q.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block:'start' }); } catch (e) {}
  if (!REDUCED) skipBtn.hidden = false;
  a.addEventListener('click', () => { seq.fast = true; });
  await typeInto(a, s.qa[qi].a, seq, 22);
  if (seq.cancel) return;
  skipBtn.hidden = true;
  const chip = $('.topbar .chip'); if (chip) chip.textContent = fr(`${S.asked[id].length} / 2 questions`);
  drawQButtons(id);
}

let CARD_BLOB = null;
function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' '); let line = '', yy = y;

    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}

  x.fillStyle = g; x.fillRect(0, 0, W, H);

  x.shadowColor = 'transparent';
  for (let i = 0; i < 5000; i++) { x.fillStyle = `rgba(110,80,40,${(rnd() * .08).toFixed(3)})`; x.fillRect(-400 + rnd() * 800, -250 + rnd() * 500, 2, 2); }
  x.fillStyle = '#26302f'; x.font = `44px ${TYP}`;
  x.fillText('J’ai résolu', 0, -130);

      if (arg === 'bureau-lampe') { S.lamp = !S.lamp; const d = $('#desk'); if (d) d.classList.toggle('off', !S.lamp); }
      if (arg === 'mail-spam-msg') showSpamMail();
      if (arg === 'membre-journal' && !S.spots[arg]) { S.spots[arg] = 1; const j = el.closest('.journal'); if (j) { const t = j.querySelector('.tap'); if (t) t.outerHTML = fr('<span class="jl">14 h 35 : création du compte demandée.<br>14 h 36 : e-mail de confirmation envoyé.<br><mark>14 h 36 : en attente de confirmation.</mark><br><mark>14 h 37 : dernière activité.</mark><br>Statut : réservation bloquée à l’étape 4 sur 6.</span>'); } delete S.spots[arg]; }
      hitSpot(arg);
      if (arg === 'vente-cta' || arg === 'vente-prix') { const fi = document.querySelector('.fiche'); if (fi && !fi.classList.contains('open')) { setTimeout(() => { fi.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }); fi.classList.add('pulse'); }, 900); } }
      break;
    case 'fiche':
      el.classList.add('open'); hitSpot('vente-fiche'); break;
    case 'mailtab':
      if (arg === 'spam' && !S.spots['mail-tab-spam']) { S.spots['mail-tab-spam'] = 1; el.classList.remove('spot'); save(); }
      mailTab(arg); break;
    case 'ask': { const p = arg.split(':'); askQ(p[0], +p[1]); break; }
    case 'pickClue': pickClue(arg); break;
    case 'pickSus': pickSus(arg); break;
    case 'accS': ACC.s = arg; { const y = window.scrollY; scrAccusation(); window.scrollTo(0, y); } break;
    case 'accP': {
      const i = ACC.p.indexOf(arg);
      if (i > -1) ACC.p.splice(i, 1); else { if (ACC.p.length >= 2) ACC.p.shift(); ACC.p.push(arg); }
      const y = window.scrollY; scrAccusation(); window.scrollTo(0, y); break;
    }
    case 'accuse': accuse(); break;
    case 'share': shareCard(); break;
    case 'copypost': try { navigator.clipboard.writeText(POST_URL).then(() => { const e = document.getElementById('copypost-etat'); if (e) e.textContent = 'Lien copié ✓ Colle-le dans le sticker « Lien » de ta story.'; }); } catch (e) {} track('partage', 'Copie du lien du post'); break;
    case 'download': getCardBlob().then(b => { if (b) { downloadBlob(b); track('partage', 'Téléchargement de la carte'); } }); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') closeOverlay();
});

/* Reprise automatique */
render();
})();
</script>
</body>
</html>
